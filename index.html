  <style>
    :root {
      --gray-50: #f7f7f7;
      --gray-100: #ededed;
      --gray-200: #d9d9d9;
      --gray-300: #bdbdbd;
      --gray-400: #9e9e9e;

      --line: #e2e2e2;
      --white: #ffffff;

      --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100svh;
      font-family: var(--font);
      color: var(--ink);
      background: #0f0f0f;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.loading {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 2px solid var(--gray-500);
      outline-offset: 2px;
      border-radius: 10px;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 70%),
        linear-gradient(180deg, #1c1c1c 0%, #141414 55%, #0d0d0d 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 26%, #6a6a6a 0%, #3d3d3d 36%, #1f1f1f 70%, #0a0a0a 100%);
      box-shadow: inset -10px -14px 28px rgba(0, 0, 0, .6), 0 20px 40px -18px rgba(0, 0, 0, .7);
      animation: bob 9s ease-in-out infinite alternate;
      opacity: .55;
    }

    .orb.a { width: 170px; height: 170px; right: -95px; top: 150px; }
    .orb.b { width: 150px; height: 150px; left: -100px; top: 56%; animation-delay: -3s; }
    .orb.c { width: 200px; height: 200px; right: -120px; bottom: 4%; animation-delay: -6s; }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 999;
      color: var(--white);
      font-family: var(--font);
    }

    #loader .panel {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50.5%;
      background:
        repeating-linear-gradient(115deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 16px),
        linear-gradient(160deg, #3a3a3a 0%, #1f1f1f 50%, #0d0d0d 100%);
      background-size: 100% 200%, 100% 200%;
      transition: transform .95s cubic-bezier(.77, 0, .18, 1) .4s;
    }

    #loader .panel.top { top: 0; background-position: top, top; }
    #loader .panel.bottom { bottom: 0; background-position: bottom, bottom; }

    #loader .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      transition: opacity .45s ease, transform .45s ease;
    }

    #loader.done .center { opacity: 0; transform: scale(.96); }
    #loader.done .panel.top { transform: translateY(-101%); }
    #loader.done .panel.bottom { transform: translateY(101%); }

    .gauge { position: relative; width: 130px; height: 130px; }
    .gauge svg { display: block; width: 100%; height: 100%; overflow: visible; }

    .gauge .orbit {
      fill: none;
      stroke: rgba(255, 255, 255, .35);
      stroke-width: 1.2;
      stroke-dasharray: 1.5 9;
      stroke-linecap: round;
      transform-box: fill-box;

    .gauge .disc { fill: rgba(255, 255, 255, .06); }
    .gauge .track { fill: none; stroke: rgba(255, 255, 255, .15); stroke-width: 4.5; }

    .gauge .bar {

      stroke: var(--white);
      stroke-width: 4.5;
      stroke-linecap: round;

    .gauge .num {

      inset: 0;
      display: flex;

      letter-spacing: -.04em;

    .word {

    .word span { display: block; overflow: hidden; line-height: 1.3; }
    .word span.dim { color: rgba(255, 255, 255, .45); }

    .word b {
      display: block;
      font-weight: 800;
      transform: translateY(110%);
      animation: letter .7s var(--ease) forwards;
      animation-delay: calc(.15s + var(--i) * .07s);

    #status {

      margin-top: -8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      color: rgba(255, 255, 255, .6);

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
    }

    .rise { opacity: 0; }

    body.ready .rise {
      opacity: 1;
      animation: rise .85s var(--ease) backwards;
      animation-delay: calc(.15s + var(--i) * .08s);
    }

    .hero {
      position: relative;
      margin-top: 34px;
      padding: 22px 18px 20px;
      border-radius: 22px;
      color: var(--white);
      background: linear-gradient(135deg, #3a3a3a 0%, #242424 55%, #131313 100%);

    .hero::before,

      pointer-events: none;

    .hero::before {
      background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 15px);

    .hero::after {
      bottom: 45%;

    }

    .hero > * { position: relative; z-index: 1; }

    .hero-top {

    }

    .who { min-width: 0; padding-top: 2px; }

    .name {

      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.1;
      word-break: break-word;

    .badge { display: block; flex: none; width: 20px; height: 20px; }

    .username {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, .6);
    }

    .avatar-wrap { flex: none; margin: -38px -2px 0 0; opacity: 0; }

    body.ready .avatar-wrap {
      opacity: 1;
      animation: pop 1.1s var(--ease) .2s backwards;
    }

    .avatar {
      position: relative;
      width: 84px;
      height: 84px;

    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #bdbdbd 55%, #6e6e6e);
      box-shadow: 0 12px 22px -8px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .15);

    .avatar::after {
      content: "";

      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .6), transparent 70%);
      filter: blur(2px);

    .photo {

      border: 3px solid var(--white);

    }

    .photo img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bio {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, .12);

    .bio span { flex: 1; }

    .bio .quote {

    .bio .quote.open { align-self: flex-start; transform: rotate(180deg); }
    .bio .quote.close { align-self: flex-end; }

    .hero-actions { margin-top: 16px; }

    .btn {
      display: flex;

      height: 44px;

      border: 0;
      border-radius: 14px;

      font-weight: 700;

      transition: transform .25s var(--ease), background-color .25s ease;

    .btn svg { display: block; flex: none; width: 18px; height: 18px; }

    .btn.primary {
      background: var(--white);

      box-shadow: 0 8px 16px -10px rgba(0, 0, 0, .9), inset 0 -2px 0 rgba(0, 0, 0, .08);
    }

    .btn.primary svg { fill: currentColor; }
    .btn:active { transform: scale(.97); }

    .card {
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 22px;
      background: #1e1e1e;
      box-shadow: var(--card-shadow);
    }

    .card h2 {
      margin-bottom: 14px;
      padding-left: 2px;

      letter-spacing: -.01em;
      color: var(--white);

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--gray-300);
    }

    .tile .ico {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      max-width: 58px;
      aspect-ratio: 1;
      border-radius: 18px;
      background: linear-gradient(160deg, var(--c1), var(--c2));
      color: var(--white);
      box-shadow:
        0 10px 16px -8px rgba(0, 0, 0, .8),
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 -4px 0 rgba(0, 0, 0, .35);
      transition: transform .3s var(--ease);
    }

    .tile .ico::before {
      content: "";
      position: absolute;
      inset: 3px 3px 50% 3px;
      border-radius: 15px 15px 50% 50% / 15px 15px 12px 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .02));
      pointer-events: none;
    }

    .tile .ico svg {
      position: relative;
      display: block;
      width: 24px;
      height: 24px;
      overflow: visible;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35));
    }

    .tile .ico .fill { fill: currentColor; }
    .tile .ico .stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tile:active .ico { transform: translateY(2px) scale(.95); }

    @media (hover: hover) {
      .tile:hover .ico { transform: translateY(-3px); }
    }

    .player { padding: 0; overflow: hidden; }

    .player-head { display: grid; grid-template-columns: auto 1fr; align-items: center; }

    .cover {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin: 12px 0 12px 12px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(160deg, #5a5a5a, #2a2a2a);
      color: var(--white);
      box-shadow: 0 10px 16px -8px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .18), inset 0 -3px 0 rgba(0, 0, 0, .35);
    }

    .cover i { font-size: 20px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35)); }

    .player-toggle {
      display: grid;
      grid-template-columns: 1fr 36px;
      align-items: center;
      column-gap: 10px;
      min-width: 0;
      padding: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .song { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

    .song b,
    .song span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .song b {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--white);
    }

    .song span { font-size: 11px; font-weight: 500; color: var(--gray-500); }

    .chev {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
      box-shadow: 0 6px 12px -6px rgba(0, 0, 0, .8);
    }

    .chev svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--gray-300);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .4s var(--ease);
    }

    .player.open .chev svg { transform: rotate(180deg); }

    .drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .5s var(--ease);
    }

    .player.open .drawer { grid-template-rows: 1fr; }

    .drawer > .inner { min-height: 0; overflow: hidden; }
    .drawer .body { padding: 0 16px 18px; }

    .seek {
      --p: 0%;
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 20px;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    .seek::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(to right, #bdbdbd, #7a7a7a) 0 0 / var(--p) 100% no-repeat, #333;
    }

    .seek::-moz-range-track {
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(to right, #bdbdbd, #7a7a7a) 0 0 / var(--p) 100% no-repeat, #333;
    }

    .seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -5px;
      border: 3px solid #1a1a1a;
      border-radius: 50%;
      background: #d9d9d9;
      box-shadow: 0 3px 6px rgba(0, 0, 0, .5);
    }

    .seek::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 3px solid #1a1a1a;
      border-radius: 50%;
      background: #d9d9d9;
      box-shadow: 0 3px 6px rgba(0, 0, 0, .5);
    }

    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--gray-500);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .ctl {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
      color: var(--gray-200);
      box-shadow: 0 8px 14px -8px rgba(0, 0, 0, .9);
      cursor: pointer;
      transition: transform .2s var(--ease);
    }

    .ctl svg {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ctl svg text {

      stroke: none;
      font-family: var(--font);
      font-size: 8.5px;
      font-weight: 800;
    }

    .ctl:active { transform: scale(.92); }

    .ctl.main {
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(160deg, #d9d9d9, #7a7a7a 60%, #3d3d3d);
      color: #111;
      box-shadow:
        0 0 0 3px #1e1e1e,
        0 0 0 5px rgba(255, 255, 255, .08),
        0 12px 20px -10px rgba(0, 0, 0, .9),
        inset 0 -4px 0 rgba(0, 0, 0, .2);
    }

    .ctl.main::before {
      content: "";
      position: absolute;
      inset: 4px 7px 50% 7px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0));

    .ctl.main svg {

    .ctl .i-pause,
    .player.playing .ctl .i-play { display: none; }
    .player.playing .ctl .i-pause { display: block; }

    @media (hover: hover) {
      .ctl:not(.main):hover { transform: translateY(-2px); }
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, .88);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s ease, visibility 0s linear .35s;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
      transition: opacity .35s ease;
    }

    .zoom-box {
      position: relative;
      line-height: 0;
      opacity: 0;
      filter: blur(8px);
      transform: scale(.55);
      transition: transform .6s var(--ease), opacity .4s ease, filter .4s ease;

    .lightbox.open .zoom-box { opacity: 1; filter: none; transform: none; }

    .zoom-box img {
      display: block;
      border: 3px solid var(--white);
      border-radius: 20px;
      background: #2a2a2a;
      box-shadow: 0 24px 60px -16px rgba(0, 0, 0, .9);
    }

    .zoom-close {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 12px;
      background: var(--white);
      color: #111;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .5);

    .zoom-close svg {

      width: 18px;
      height: 18px;

      stroke-width: 2.6;
      stroke-linecap: round;

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-14px); }

  <script>
    const $ = (id) => document.getElementById(id);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function initLoader() {
      const CIRCUMFERENCE = 439.82;
      const loader = $("loader");
      const bar = $("bar");
      const percent = $("pct");
      const status = $("status");
      const duration = reduceMotion ? 700 : 2800;
      const startTime = performance.now();
      let loaded = document.readyState === "complete";
      let lastMessage = "";

      window.addEventListener("load", () => { loaded = true; });

      const ease = (t) => (t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);

      const messageFor = (n) => {
        if (n < 35) return "Memuat";
        if (n < 75) return "Menyiapkan";
        if (n < 100) return "Hampir siap";
        return "Oke Sudah Siap!";
      };

      const render = (p) => {
        const n = Math.floor(p);
        const message = messageFor(n);
        bar.style.strokeDashoffset = (CIRCUMFERENCE * (1 - p / 100)).toFixed(2);
        percent.textContent = n;
        if (message !== lastMessage) {
          status.textContent = message;
          lastMessage = message;
        }
      };

      const finish = () => {
        render(100);
        setTimeout(() => {
          loader.classList.add("done");
          setTimeout(() => document.body.classList.add("ready"), 650);
          setTimeout(() => {
            document.body.classList.remove("loading");
            loader.style.display = "none";
          }, 1600);
        }, 380);
      };

      const tick = (now) => {
        const t = Math.min((now - startTime) / duration, 1);
        let p = ease(t) * 100;
        if (!loaded) p = Math.min(p, 96);
        render(p);
        if (t >= 1 && loaded) return finish();
        requestAnimationFrame(tick);
      };

      requestAnimationFrame(tick);
    }

    function initPlayer() {
      const player = $("player");
      const toggle = $("playerToggle");
      const drawer = $("playerDrawer");
      const audio = $("audio");
      const seek = $("seek");
      const timeNow = $("timeNow");
      const timeTotal = $("timeTotal");
      const btnPlay = $("btnPlay");
      const btnBack = $("btnBack");
      const btnForward = $("btnForward");
      const btnPrev = $("btnPrev");
      const btnNext = $("btnNext");
      const songTitle = $("songTitle");
      const songArtist = $("songArtist");
      const STEP = 3;
      let dragging = false;

      // === PLAYLIST ===
      const playlist = [
        {
          title: "nuts",
          artist: "Lil Peep",
          src: "https://www.image2url.com/r2/default/audio/1791712311994-bc22b578-5caf-4743-b9aa-bfefda23aede.mp3"
        },
        {
          title: "Monokrom",
          artist: "Tulus",
          src: "https://www.image2url.com/r2/default/audio/1791298868113-8f62cfd6-56e5-424a-a276-5dd24bbc4982.mp3"
        }
      ];
      let current = 0;

      const format = (seconds) => {
        const s = isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      };

      const loadTrack = (index, autoplay) => {
        current = (index + playlist.length) % playlist.length;
        const track = playlist[current];
        audio.src = track.src;
        songTitle.textContent = track.title;
        songArtist.textContent = track.artist;
        seek.value = 0;
        seek.style.setProperty("--p", "0%");
        timeNow.textContent = "0:00";
        timeTotal.textContent = "0:00";
        if (autoplay) audio.play().catch(() => {});
      };

      const paint = () => {
        const duration = audio.duration || 0;
        const curr = audio.currentTime || 0;
        const percent = duration ? (curr / duration) * 100 : 0;
        seek.style.setProperty("--p", `${percent}%`);
        if (!dragging) seek.value = percent;
        timeNow.textContent = format(curr);
        timeTotal.textContent = format(duration);
      };

      const setPlaying = (playing) => {
        player.classList.toggle("playing", playing);
        btnPlay.setAttribute("aria-label", playing ? "Jeda" : "Putar");
      };

      const setOpen = (open) => {
        player.classList.toggle("open", open);
        drawer.inert = !open;
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Tutup pemutar lagu" : "Buka pemutar lagu");
      };

      const endDrag = () => {
        dragging = false;
        paint();
      };

      toggle.addEventListener("click", () => setOpen(!player.classList.contains("open")));

      btnPlay.addEventListener("click", () => {
        if (!audio.src) { loadTrack(current, true); return; }
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      });

      btnBack.addEventListener("click", () => {
        audio.currentTime = Math.max(0, audio.currentTime - STEP);
        paint();
      });

      btnForward.addEventListener("click", () => {
        audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + STEP);
        paint();
      });

      btnNext.addEventListener("click", () => loadTrack(current + 1, true));
      btnPrev.addEventListener("click", () => {
        if (audio.currentTime > 3) {
          audio.currentTime = 0;
        } else {
          loadTrack(current - 1, true);
        }
      });

      seek.addEventListener("pointerdown", () => { dragging = true; });
      seek.addEventListener("pointerup", endDrag);
      seek.addEventListener("change", endDrag);
      seek.addEventListener("input", () => {
        if (!audio.duration) return;
        audio.currentTime = (seek.value / 100) * audio.duration;
        paint();
      });

      audio.addEventListener("play", () => setPlaying(true));
      audio.addEventListener("pause", () => setPlaying(false));
      audio.addEventListener("ended", () => loadTrack(current + 1, true));
      audio.addEventListener("timeupdate", paint);
      audio.addEventListener("loadedmetadata", paint);
      audio.addEventListener("durationchange", paint);

      // Set metadata awal (tanpa autoplay)
      songTitle.textContent = playlist[0].title;
      songArtist.textContent = playlist[0].artist;
      audio.src = playlist[0].src;
      paint();
    }

    function initLightbox() {
      const box = $("lightbox");
      const zoomImg = $("zoomImg");
      const closeBtn = $("zoomClose");
      const main = document.querySelector("main");
      let source = null;
      let trigger = null;
      let isOpen = false;

      const fit = () => {
        if (!source || !source.naturalWidth) return;
        const { naturalWidth: w, naturalHeight: h } = source;
        const scale = Math.min(Math.min(innerWidth * .92, 480) / w, (innerHeight * .8) / h);
        zoomImg.style.width = `${Math.round(w * scale)}px`;
        zoomImg.style.height = `${Math.round(h * scale)}px`;
      };

      const open = (img, button) => {
        if (isOpen || !img || img.style.display === "none" || !img.naturalWidth) return;
        isOpen = true;
        source = img;
        trigger = button;
        zoomImg.alt = img.alt;
        zoomImg.src = img.currentSrc || img.src;
        fit();
        main.inert = true;
        document.body.style.overflow = "hidden";
        box.classList.add("open");
        closeBtn.focus({ preventScroll: true });
      };

      const close = () => {
        if (!isOpen) return;
        isOpen = false;
        box.classList.remove("open");
        main.inert = false;
        document.body.style.overflow = "";
        trigger?.focus({ preventScroll: true });
      };

      const bind = (element) => {
        const launch = () => open(element.querySelector("img"), element);
        element.addEventListener("click", launch);
        element.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          launch();
        });
      };

      bind($("photo"));
      closeBtn.addEventListener("click", close);
      box.addEventListener("click", (event) => { if (event.target === box) close(); });
      addEventListener("keydown", (event) => { if (event.key === "Escape") close(); });
      addEventListener("resize", () => { if (isOpen) fit(); });
    }

    $("year").textContent = new Date().getFullYear();
    initLoader();
    initPlayer();
    initLightbox();
  </script>
</body>
</html>
