    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100svh; font-family: var(--font); color: var(--text-main);
      background: var(--bg-3); overflow-x: hidden;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      transition: background-color .4s ease, color .4s ease;
    }
    body.loading { overflow: hidden; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 10px; }

    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,255,255,.05), rgba(255,255,255,0) 70%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      transition: background .4s ease;
    }
    .orb {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle at 30% 26%, var(--accent-2) 0%, var(--accent-3) 36%, var(--bg-2) 70%, var(--bg-3) 100%);
      box-shadow: inset -10px -14px 28px rgba(0,0,0,.3), 0 20px 40px -18px rgba(0,0,0,.5);
      animation: bob 9s ease-in-out infinite alternate; opacity: .4;
      transition: background .4s ease;
    }
    .orb.a { width: 170px; height: 170px; right: -95px; top: 150px; }
    .orb.b { width: 150px; height: 150px; left: -100px; top: 56%; animation-delay: -3s; }
    .orb.c { width: 200px; height: 200px; right: -120px; bottom: 4%; animation-delay: -6s; }

    #loader { position: fixed; inset: 0; z-index: 999; color: #fff; font-family: var(--font); }
    #loader .panel {
      position: absolute; left: 0; width: 100%; height: 50.5%;
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 16px),
        linear-gradient(160deg, var(--accent-3) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      background-size: 100% 200%, 100% 200%;
      transition: transform .95s cubic-bezier(.77,0,.18,1) .4s, background .4s ease;
    }
    #loader .panel.top { top: 0; }
    #loader .panel.bottom { bottom: 0; }
    #loader .center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      transition: opacity .45s ease, transform .45s ease;
    }
    #loader.done .center { opacity: 0; transform: scale(.96); }
    #loader.done .panel.top { transform: translateY(-101%); }
    #loader.done .panel.bottom { transform: translateY(101%); }

    .gauge { position: relative; width: 130px; height: 130px; }
    .gauge svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .gauge .orbit {
      fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1.2;
      stroke-dasharray: 1.5 9; stroke-linecap: round;
      transform-box: fill-box; transform-origin: center;
      animation: spin 18s linear infinite reverse;
    }
    .gauge .disc { fill: rgba(255,255,255,.06); }
    .gauge .track { fill: none; stroke: rgba(255,255,255,.15); stroke-width: 4.5; }
    .gauge .bar {
      fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(255,255,255,.4));
    }
    .gauge .num {
      position: absolute; inset: 0; display: flex; align-items: baseline;
      justify-content: center; padding-top: 44px; font-size: 34px; font-weight: 800;
      letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: #fff;
    }
    .gauge .num i {
      margin-left: 2px; font-size: 13px; font-style: normal; font-weight: 700;
      color: rgba(255,255,255,.55);
    }
    .word {
      display: flex; margin-right: -.3em; font-size: 15px;
      font-weight: 800; letter-spacing: .3em; color: #fff;
    }
    .word span { display: block; overflow: hidden; line-height: 1.3; }
    .word span.dim { color: rgba(255,255,255,.45); }
    .word b {
      display: block; font-weight: 800; transform: translateY(110%);
      animation: letter .7s var(--ease) forwards;
      animation-delay: calc(.15s + var(--i) * .07s);
    }
    #status {
      min-height: 1.3em; margin-top: -8px; font-size: 11px;
      font-weight: 600; letter-spacing: .04em; color: rgba(255,255,255,.6);
    }

    main {
      position: relative; z-index: 1; display: flex; flex-direction: column;
      gap: 12px; width: 100%; max-width: 420px; min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
    }
    .rise { opacity: 0; }
    body.ready .rise {
      opacity: 1; animation: rise .85s var(--ease) backwards;
      animation-delay: calc(.15s + var(--i) * .08s);
    }

    .hero {
      position: relative; margin-top: 34px; padding: 22px 18px 20px;
      border-radius: 22px; color: var(--text-main);
      background: linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);
      box-shadow:
        0 16px 30px -14px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -6px 0 rgba(0,0,0,.15);
      transition: background .4s ease;
    }
    .hero::before, .hero::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    }
    .hero::before {
      background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 15px);
    }
    .hero::after {
      bottom: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,0));
    }
    .hero > * { position: relative; z-index: 1; }
    .hero-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .who { min-width: 0; padding-top: 2px; }
    .name {
      display: flex; align-items: center; gap: 6px; font-size: 22px;
      font-weight: 800; letter-spacing: -.03em; line-height: 1.1; word-break: break-word;
    }
    .badge { display: block; flex: none; width: 20px; height: 20px; }
    .username {
      margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    }
    .avatar-wrap { flex: none; margin: -38px -2px 0 0; opacity: 0; }
    body.ready .avatar-wrap {
      opacity: 1; animation: pop 1.1s var(--ease) .2s backwards;
    }
    .avatar {
      position: relative; width: 84px; height: 84px;
      animation: float 6s ease-in-out infinite;
    }
    .avatar::before {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, var(--accent-2) 55%, var(--accent-3));
      box-shadow: 0 12px 22px -8px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.3);
      transition: background .4s ease;
    }
    .avatar::after {
      content: ""; position: absolute; left: 14%; right: 14%; bottom: -16px;
      height: 9px; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.4), transparent 70%);
      filter: blur(2px);
    }
    .photo {
      position: absolute; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; border: 3px solid #fff; border-radius: 50%;
      background: linear-gradient(145deg, var(--icon-bg-1), var(--icon-bg-2));
      font-size: 30px; font-weight: 800; color: #fff; cursor: zoom-in;
      transition: background .4s ease;
    }
    .photo img {
      position: absolute; inset: 0; display: block;
      width: 100%; height: 100%; object-fit: cover;
    }

    .bio {
      display: flex; align-items: center; gap: 8px;
      margin-top: 16px; padding: 11px 12px;
      border: 1px solid var(--line-mid); border-radius: 14px;
      background: rgba(255,255,255,.06);
      font-size: 12px; font-weight: 700; line-height: 1.4;
      letter-spacing: .02em; text-transform: uppercase;
      color: var(--text-main); text-align: center; min-height: 40px;
    }
    .bio .bio-text { flex: 1; }
    .bio .caret {
      display: inline-block; width: 2px; height: 1em; margin-left: 2px;

    // === THEME + MODE ===
    function initTheme() {
      const root = document.documentElement;

      dots.forEach(dot => dot.addEventListener("click", () => applyTheme(dot.dataset.theme)));

    // === LIKE ===
    function initLike() {
      const btn = $("likeBtn");

    // === TYPING BIO ===
    function initTyping() {
      const target = $("bioType");
      const text = "Hanya seorang vibe coder";
      let i = 0;
      let deleting = false;
      if (reduceMotion) { target.textContent = text; return; }

      const tick = () => {
        if (!deleting) {
          target.textContent = text.slice(0, i + 1);
          i++;
          if (i === text.length) {
            deleting = true;
            setTimeout(tick, 1800);
            return;
          }
          setTimeout(tick, 70);
        } else {
          target.textContent = text.slice(0, i - 1);
          i--;
          if (i === 0) {
            deleting = false;
            setTimeout(tick, 500);
            return;
          }
          setTimeout(tick, 35);
        }
      };
      setTimeout(tick, 800);
    }

    // === CLOCK ===
    function initClock() {
      const timeEl = $("clockTime");
      const dateEl = $("clockDate");
      const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
      const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      const pad = (n) => String(n).padStart(2, "0");

      const update = () => {
        const d = new Date();
        const h = pad(d.getHours());
        const m = pad(d.getMinutes());
        const s = pad(d.getSeconds());
        timeEl.innerHTML = `${h}<span class="colon">:</span>${m}<span class="colon">:</span>${s}`;
        dateEl.textContent = `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
      };
      update();
      setInterval(update, 1000);
    }

    // === LOADER ===
    function initLoader() {
      const CIRCUMFERENCE = 439.82;
      const loader = $("loader");
      const bar = $("bar");
      const percent = $("pct");
      const status = $("status");
      const duration = reduceMotion ? 700 : 2800;
      const startTime = performance.now();
      let loaded = document.readyState === "complete";
      let lastMessage = "";

      window.addEventListener("load", () => { loaded = true; });

      const ease = (t) => (t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);
      const messageFor = (n) => {
        if (n < 35) return "Memuat";
        if (n < 75) return "Menyiapkan";
        if (n < 100) return "Hampir siap";
        return "Oke Sudah Siap!";
      };

      const render = (p) => {
        const n = Math.floor(p);
        const message = messageFor(n);
        bar.style.strokeDashoffset = (CIRCUMFERENCE * (1 - p / 100)).toFixed(2);
        percent.textContent = n;
        if (message !== lastMessage) {
          status.textContent = message;
          lastMessage = message;
        }
      };

      const finish = () => {
        render(100);
        setTimeout(() => {
          loader.classList.add("done");
          setTimeout(() => document.body.classList.add("ready"), 650);
          setTimeout(() => {
            document.body.classList.remove("loading");
            loader.style.display = "none";
          }, 1600);
        }, 380);
      };

      const tick = (now) => {
        const t = Math.min((now - startTime) / duration, 1);
        let p = ease(t) * 100;
        if (!loaded) p = Math.min(p, 96);
        render(p);
        if (t >= 1 && loaded) return finish();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    // === PLAYER ===
    function initPlayer() {
      const player = $("player");
      const toggle = $("playerToggle");
      const drawer = $("playerDrawer");
      const audio = $("audio");
      const seek = $("seek");
      const timeNow = $("timeNow");
      const timeTotal = $("timeTotal");
      const btnPlay = $("btnPlay");
      const btnBack = $("btnBack");
      const btnForward = $("btnForward");
      const btnPrev = $("btnPrev");
      const btnNext = $("btnNext");
      const songTitle = $("songTitle");
      const songArtist = $("songArtist");
      const viz = $("viz");
      const STEP = 3;
      let dragging = false;

      const playlist = [
        { title: "Monokrom", artist: "Tulus", src: "https://www.image2url.com/r2/default/audio/1791298868113-8f62cfd6-56e5-424a-a276-5dd24bbc4982.mp3" },
        { title: "nuts", artist: "Lil Peep", src: "https://www.image2url.com/r2/default/audio/1791712311994-bc22b578-5caf-4743-b9aa-bfefda23aede.mp3" }
      ];
      let current = 0;

      const BARS = 16;
      for (let i = 0; i < BARS; i++) {
        const b = document.createElement("span");
        b.className = "bar";
        viz.appendChild(b);
      }
      const bars = viz.querySelectorAll(".bar");
      const heights = new Array(BARS).fill(0.1);
      let vizTimer = null;
      const startViz = () => {
        if (vizTimer) return;
        vizTimer = setInterval(() => {
          bars.forEach((bar, i) => {
            const beat = (i % 4 === 0) ? 1.15 : 1;
            const target = 0.15 + Math.random() * 0.85 * beat;
            heights[i] = heights[i] * 0.5 + target * 0.5;
            bar.style.height = Math.min(100, heights[i] * 100) + "%";
          });
        }, 90);
      };
      const stopViz = () => {
        if (vizTimer) { clearInterval(vizTimer); vizTimer = null; }
        bars.forEach(b => b.style.height = "8%");
      };

      const format = (seconds) => {
        const s = isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      };

      const loadTrack = (index, autoplay) => {
        current = (index + playlist.length) % playlist.length;
        const track = playlist[current];
        audio.src = track.src;
        songTitle.textContent = track.title;
        songArtist.textContent = track.artist;
        seek.value = 0;
        seek.style.setProperty("--p", "0%");
        timeNow.textContent = "0:00";
        timeTotal.textContent = "0:00";
        if (autoplay) audio.play().catch(() => {});
      };

      const paint = () => {
        const duration = audio.duration || 0;
        const curr = audio.currentTime || 0;
        const percent = duration ? (curr / duration) * 100 : 0;
        seek.style.setProperty("--p", `${percent}%`);
        if (!dragging) seek.value = percent;
        timeNow.textContent = format(curr);
        timeTotal.textContent = format(duration);
      };

      const setPlaying = (playing) => {
        player.classList.toggle("playing", playing);
        btnPlay.setAttribute("aria-label", playing ? "Jeda" : "Putar");
        if (playing) startViz(); else stopViz();
      };

      const setOpen = (open) => {
        player.classList.toggle("open", open);
        drawer.inert = !open;
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Tutup pemutar lagu" : "Buka pemutar lagu");
      };

      const endDrag = () => { dragging = false; paint(); };

      toggle.addEventListener("click", () => setOpen(!player.classList.contains("open")));
      btnPlay.addEventListener("click", () => {
        if (!audio.src) { loadTrack(current, true); return; }
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      });
      btnBack.addEventListener("click", () => {
        audio.currentTime = Math.max(0, audio.currentTime - STEP); paint();
      });
      btnForward.addEventListener("click", () => {
        audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + STEP); paint();
      });
      btnNext.addEventListener("click", () => loadTrack(current + 1, true));
      btnPrev.addEventListener("click", () => {
        if (audio.currentTime > 3) audio.currentTime = 0;
        else loadTrack(current - 1, true);
      });

      seek.addEventListener("pointerdown", () => { dragging = true; });
      seek.addEventListener("pointerup", endDrag);
      seek.addEventListener("change", endDrag);
      seek.addEventListener("input", () => {
        if (!audio.duration) return;
        audio.currentTime = (seek.value / 100) * audio.duration;
        paint();
      });

      audio.addEventListener("play", () => setPlaying(true));
      audio.addEventListener("pause", () => setPlaying(false));
      audio.addEventListener("ended", () => loadTrack(current + 1, true));
      audio.addEventListener("timeupdate", paint);
      audio.addEventListener("loadedmetadata", paint);
      audio.addEventListener("durationchange", paint);

      songTitle.textContent = playlist[0].title;
      songArtist.textContent = playlist[0].artist;
      audio.src = playlist[0].src;
      paint();
    }

    // === LIGHTBOX ===
    function initLightbox() {
      const box = $("lightbox");
      const zoomImg = $("zoomImg");
      const closeBtn = $("zoomClose");
      const main = document.querySelector("main");
      let source = null, trigger = null, isOpen = false;

      const fit = () => {
        if (!source || !source.naturalWidth) return;
        const { naturalWidth: w, naturalHeight: h } = source;
        const scale = Math.min(Math.min(innerWidth * .92, 480) / w, (innerHeight * .8) / h);
        zoomImg.style.width = `${Math.round(w * scale)}px`;
        zoomImg.style.height = `${Math.round(h * scale)}px`;
      };
      const open = (img, button) => {
        if (isOpen || !img || img.style.display === "none" || !img.naturalWidth) return;
        isOpen = true; source = img; trigger = button;
        zoomImg.alt = img.alt;
        zoomImg.src = img.currentSrc || img.src;
        fit();
        main.inert = true;
        document.body.style.overflow = "hidden";
        box.classList.add("open");
        closeBtn.focus({ preventScroll: true });
      };
      const close = () => {
        if (!isOpen) return;
        isOpen = false;
        box.classList.remove("open");
        main.inert = false;
        document.body.style.overflow = "";
        trigger?.focus({ preventScroll: true });
      };
      const bind = (element) => {
        const launch = () => open(element.querySelector("img"), element);
        element.addEventListener("click", launch);
        element.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault(); launch();
        });
      };
      bind($("photo"));
      closeBtn.addEventListener("click", close);
      box.addEventListener("click", (event) => { if (event.target === box) close(); });
      addEventListener("keydown", (event) => { if (event.key === "Escape") close(); });
      addEventListener("resize", () => { if (isOpen) fit(); });
    }

    $("year").textContent = new Date().getFullYear();
    initTheme();
    initLike();
    initTyping();
    initClock();
    initLoader();
    initPlayer();
    initLightbox();
  </script>
</body>
</html>
